# Alembic configuration for PostPilot AI.
#
# The database URL and logging are intentionally not configured here. alembic/env.py
# builds the URL from the same environment-driven settings as the API and reuses the
# application's structured, secret-redacting logging.

[alembic]
script_location = %(here)s/alembic

# Makes the `app` package importable from alembic/env.py.
prepend_sys_path = .
path_separator = os

# Date-prefixed revision files sort chronologically in the versions directory.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
