# PostPilot AI local stack: web, API, PostgreSQL, and Redis.
#
# Configuration comes from a .env file next to this file (copy .env.example).
# Required values use the ${VAR:?message} form, so a missing value stops Compose
# with an explanation instead of starting a service with a blank or default credential.

name: postpilot-ai

# Shared by the API and the one-shot migration job. Inside the Compose network the
# database is always reached at postgres:5432, regardless of POSTGRES_HOST/POSTGRES_PORT
# in .env (those describe how a process on the host reaches it).
x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:?Set LINKEDIN_CLIENT_ID in .env}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:?Set LINKEDIN_CLIENT_SECRET in .env}
  LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:?Set LINKEDIN_REDIRECT_URI in .env}
  LINKEDIN_SCOPES: ${LINKEDIN_SCOPES:?Set LINKEDIN_SCOPES in .env}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
  WEB_BASE_URL: ${WEB_BASE_URL:?Set WEB_BASE_URL in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1209600}

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level above the pre-18 location.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  # Provisioned for the background-publishing phase. Nothing connects to it yet.
  # Persistence is off on purpose: PostgreSQL is the system of record, and Redis will
  # only carry queue messages that can be rebuilt from it.
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      # Lets the health check authenticate without putting the password in its command.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend

  # Applies database migrations once, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: ./apps/api
    image: postpilot-ai/api:local
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: ./apps/api
    image: postpilot-ai/api:local
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # Readiness, not liveness: healthy means the API can reach PostgreSQL.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - frontend

  web:
    build:
      context: ./apps/web
      args:
        # Inlined into the browser bundle at build time. Rebuild after changing it.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
    image: postpilot-ai/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend

networks:
  # No route to or from the host or the internet. PostgreSQL and Redis live only here,
  # so they are reachable by the API and nothing else.
  backend:
    internal: true
  # Carries the two ports published to localhost: the web app and the API.
  frontend: {}

volumes:
  postgres-data:
